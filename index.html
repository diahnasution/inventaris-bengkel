<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SiPinjam SMK AKP Galang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #edf6ee;
        --mint: #cfe9d6;
        --mint2: #a9d8b8;
        --pink: #f9dbe3;
        --pink2: #f2b5c7;
        --ink: #26442f;
        --ink2: #5b7664;
        --card: #fffafb;
        --line: rgba(38, 68, 47, 0.18);
        --hot: #d9638a;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15221a;
          --mint: #26402f;
          --mint2: #3b6247;
          --pink: #43293378;
          --pink2: #7a4357;
          --ink: #e5f2e8;
          --ink2: #9db8a6;
          --card: #1e2f25;
          --line: rgba(229, 242, 232, 0.2);
          --hot: #f08cae;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15221a;
        --mint: #26402f;
        --mint2: #3b6247;
        --pink: #43293378;
        --pink2: #7a4357;
        --ink: #e5f2e8;
        --ink2: #9db8a6;
        --card: #1e2f25;
        --line: rgba(229, 242, 232, 0.2);
        --hot: #f08cae;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          500 16px/1.5 Figtree,
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", Figtree, sans-serif;
        margin: 0;
        line-height: 1.1;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 18px 40px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo img {
        height: 48px;
        width: auto;
      }
      .logo b {
        font:
          800 24px "Bricolage Grotesque",
          sans-serif;
        display: block;
        line-height: 1;
      }
      .logo small {
        color: var(--ink2);
        font-weight: 600;
        font-size: 14px;
      }
      .logo.big img {
        height: 72px;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      nav button {
        border: 0;
        background: transparent;
        padding: 8px 14px;
        border-radius: 14px 14px 4px 14px;
        cursor: pointer;
        position: relative;
      }
      nav button.on {
        background: var(--mint2);
        font-weight: 600;
      }
      nav button:hover:not(.on) {
        background: var(--mint);
      }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: var(--hot);
        color: #fff;
        border-radius: 99px;
        font-size: 12px;
        min-width: 20px;
        padding: 0 5px;
        text-align: center;
      }
      .me {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        color: var(--ink2);
      }
      .btn {
        border: 0;
        background: var(--pink2);
        color: var(--ink);
        padding: 9px 18px;
        border-radius: 16px 16px 16px 5px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .btn:hover {
        transform: translateY(-2px) rotate(-1deg);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.g {
        background: var(--mint2);
      }
      .btn.ghost {
        background: transparent;
        border: 1.5px solid var(--line);
      }
      .btn.sm {
        padding: 5px 12px;
        font-size: 14px;
      }
      :focus-visible {
        outline: 3px solid var(--hot);
        outline-offset: 2px;
      }
      h2 {
        font-size: 30px;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--ink2);
        margin: 0 0 20px;
        max-width: 60ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 26px 20px;
        padding-top: 18px;
      }
      .tag {
        position: relative;
        padding: 34px 18px 16px;
        border-radius: 10px 26px 10px 26px;
        transform-origin: 50% 8px;
        transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .tag:hover {
        transform: rotate(-2.5deg);
      }
      .tag::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        margin-left: -8px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: inset 0 0 0 2px var(--line);
      }
      .tag.c0 {
        background: var(--mint);
      }
      .tag.c1 {
        background: var(--pink);
      }
      .tag.c2 {
        background: var(--mint2);
      }
      .tag.c3 {
        background: var(--card);
        box-shadow: inset 0 0 0 2px var(--pink2);
      }
      .tag.drop {
        animation: drop 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both;
        animation-delay: calc(var(--i) * 60ms);
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-30px) rotate(7deg);
        }
      }
      .tag h3 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .tag small {
        color: var(--ink2);
        display: block;
      }
      .stock {
        margin: 12px 0;
        height: 8px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.55);
        overflow: hidden;
      }
      .stock b {
        display: block;
        height: 100%;
        background: var(--ink);
        border-radius: 9px;
        transition: width 0.6s;
      }
      .card {
        background: var(--card);
        border-radius: 22px 8px 22px 8px;
        padding: 16px 18px;
        margin-bottom: 14px;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 13px;
        font-weight: 600;
        padding: 2px 12px;
        border-radius: 99px;
        background: var(--mint);
      }
      .chip.menunggu {
        background: var(--pink);
      }
      .chip.disetujui {
        background: var(--mint2);
      }
      .chip.dipinjam {
        background: var(--mint2);
      }
      .chip.telat {
        background: var(--hot);
        color: #fff;
      }
      .chip.ditolak {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--pink2);
      }
      .track {
        display: flex;
        gap: 0;
        align-items: center;
        margin-top: 12px;
        font-size: 12px;
        color: var(--ink2);
      }
      .track span {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        position: relative;
      }
      .track span::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--line);
        z-index: 1;
        margin-bottom: 3px;
      }
      .track span::after {
        content: "";
        position: absolute;
        top: 5px;
        left: -50%;
        width: 100%;
        height: 2px;
        background: var(--line);
      }
      .track span:first-child::after {
        display: none;
      }
      .track .d::before,
      .track .d::after {
        background: var(--hot);
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        align-items: start;
      }
      .cols h3 {
        margin-bottom: 12px;
        font-size: 19px;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 9px 12px;
        margin: 4px 0 12px;
      }
      label {
        font-size: 14px;
        color: var(--ink2);
      }
      .search {
        max-width: 340px;
      }
      dialog {
        border: 0;
        border-radius: 26px 10px 26px 10px;
        background: var(--bg);
        color: var(--ink);
        padding: 24px;
        width: min(420px, 92vw);
      }
      dialog::backdrop {
        background: rgba(38, 68, 47, 0.35);
      }
      dialog[open] {
        animation: pop 0.3s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0.9) rotate(-2deg);
          opacity: 0;
        }
      }
      dialog h3 {
        margin-bottom: 14px;
        font-size: 22px;
      }
      dialog .row {
        justify-content: flex-end;
        margin-top: 6px;
      }
      .roles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 6px 0 16px;
      }
      .roles label {
        cursor: pointer;
        color: var(--ink);
      }
      .roles input {
        display: none;
      }
      .roles span {
        display: block;
        text-align: center;
        padding: 12px 6px;
        border-radius: 14px;
        background: var(--mint);
      }
      .roles input:checked + span {
        background: var(--pink2);
        font-weight: 700;
        transform: rotate(-2deg);
      }
      .login {
        max-width: 440px;
        margin: 6vh auto 0;
        background: var(--card);
        padding: 30px;
        border-radius: 40px 12px 40px 12px;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }
      .bars div {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 7px 0;
        font-size: 14px;
      }
      .bars b {
        height: 14px;
        border-radius: 7px;
        background: var(--pink2);
        transition: width 0.6s;
      }
      .bars i {
        width: 130px;
        font-style: normal;
      }
      .note {
        border-left: 5px solid var(--mint2);
        padding-left: 12px;
        margin-bottom: 12px;
      }
      .note.new {
        border-color: var(--hot);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 90px);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 20px;
        border-radius: 99px;
        transition: transform 0.4s cubic-bezier(0.3, 1.5, 0.5, 1);
        z-index: 9;
      }
      .toast.on {
        transform: translate(-50%, 0);
      }
      .live {
        margin-top: 36px;
        font-size: 13px;
        color: var(--ink2);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--hot);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
          transform: scale(1.5);
        }
      }
      .empty {
        padding: 26px;
        border-radius: 20px;
        border: 2px dashed var(--pink2);
        color: var(--ink2);
      }
      textarea.csv {
        height: 200px;
        font: 12px monospace;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .kpi {
        text-align: left;
        border: 0;
        border-top: 5px solid var(--c, var(--line));
        border-radius: 6px 6px 16px 16px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: var(--card);
        box-shadow: inset 0 0 0 1.5px var(--line);
        transition: transform 0.2s;
        color: inherit;
      }
      .kpi b {
        font:
          800 32px "Bricolage Grotesque",
          sans-serif;
      }
      .kpi span {
        color: var(--ink2);
        font-size: 14px;
      }
      button.kpi {
        cursor: pointer;
      }
      button.kpi:hover {
        transform: translateY(-3px);
      }
      button.kpi.on {
        background: var(--c);
        box-shadow: none;
      }
      button.kpi.on span {
        color: var(--ink);
      }
      .fl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 6px 0 14px;
      }
      .fl button {
        border: 1.5px solid var(--line);
        background: transparent;
        border-radius: 99px;
        padding: 5px 14px;
        cursor: pointer;
      }
      .fl button.on {
        background: var(--pink2);
        border-color: transparent;
        font-weight: 600;
      }
      .fl input,
      .fl select {
        width: auto;
        margin: 0;
        flex: 1;
        min-width: 150px;
        max-width: 260px;
      }
      .seg {
        display: flex;
        height: 10px;
        border-radius: 9px;
        overflow: hidden;
        background: var(--line);
        margin: 10px 0 6px;
      }
      .seg i {
        min-width: 0;
        transition: flex 0.5s;
      }
      .nm {
        background: none;
        border: 0;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0;
        text-align: left;
      }
      .car {
        display: inline-block;
        transition: transform 0.2s;
      }
      .car.o {
        transform: rotate(90deg);
      }
      .det {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1.5px dashed var(--line);
        font-size: 14px;
      }
      .panel {
        background: var(--card);
        border-radius: 16px;
        padding: 18px;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }
      .panel h3 {
        font-size: 17px;
        margin-bottom: 14px;
      }
      .cols2 {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 14px;
      }
      @media (max-width: 720px) {
        .cols2 {
          grid-template-columns: 1fr;
        }
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 150px;
      }
      .chart div {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        height: 100%;
        font-size: 12px;
        color: var(--ink2);
      }
      .chart i {
        width: 100%;
        background: var(--pink2);
        border-radius: 8px 8px 3px 3px;
        min-height: 4px;
        transition: height 0.6s;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        color: var(--ink2);
        font-weight: 600;
        padding: 8px 6px;
        border-bottom: 1.5px solid var(--line);
      }
      td {
        padding: 9px 6px;
        border-bottom: 1px solid var(--line);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap"><div id="app"></div></div>
    <dialog id="dlg"></dialog>
    <div class="toast" id="toast"></div>

                loanCard(
                  l,
                  `<button class="btn g sm" data-a="ok" data-id="${l.id}">Setujui</button><button class="btn ghost sm" data-a="no" data-id="${l.id}">Tolak</button>`,
                ),
              )
              .join("") || `<div class="empty">Tidak ada pengajuan baru.</div>`
          }</div>
<div><h3>Siap diambil</h3>${
            g(["disetujui"])
              .map((l) =>
                loanCard(
                  l,
                  `<button class="btn g sm" data-a="pick" data-id="${l.id}">Konfirmasi diambil</button>`,
                ),
              )
              .join("") ||
            `<div class="empty">Belum ada yang menunggu diambil.</div>`
          }</div>
<div><h3>Sedang dipinjam</h3>${
            g(["dipinjam", "telat"])
              .map((l) =>
                loanCard(
                  l,
                  `<button class="btn sm" data-a="ret" data-id="${l.id}">Konfirmasi kembali</button>`,
                ),
              )
              .join("") || `<div class="empty">Semua alat ada di bengkel.</div>`
          }</div></div>`;
        },
        alat: () => `<div class="row"><div><h2>Data alat</h2><p class="sub">Klik kartu angka atau tombol filter untuk menyaring alat berdasarkan status.</p></div><button class="btn" data-a="addt">Tambah alat</button></div><div class="kpis" id="tsum"></div>
<div class="fl" id="tchips"></div><div class="fl"><input id="tq" placeholder="Cari nama atau kategori alat" value="${esc(af.q)}"><select id="tsort"><option value="nama">Urut nama</option><option value="sisa" ${af.sort == "sisa" ? "selected" : ""}>Stok paling sedikit</option></select></div><div id="tlist"></div>`,
        dash: () => {
          const L = D.loans,
            out = L.filter((l) => ["dipinjam", "telat"].includes(l.status)),
            late = L.filter((l) => l.status == "telat"),
            wait = L.filter((l) => l.status == "menunggu");
          const units = D.tools.reduce((a, t) => a + t.total, 0),
            inUse = D.tools.reduce((a, t) => a + used(t), 0),
            pct = units ? Math.round((inUse / units) * 100) : 0;
          const days = [...Array(7)].map((_, i) => {
            const d = new Date(Date.now() - (6 - i) * DAY);
            d.setHours(0, 0, 0, 0);
            return { d: d.getTime(), n: 0 };
          });
          L.forEach((l) => {
            const x = days.find((k) => l.at >= k.d && l.at < k.d + DAY);
            if (x) x.n++;
          });
          const mx = Math.max(1, ...days.map((x) => x.n));
          const st = [
              "menunggu",
              "disetujui",
              "dipinjam",
              "telat",
              "dikembalikan",
              "ditolak",
            ].map((s) => [s, L.filter((l) => l.status == s).length]),
            sm = Math.max(1, ...st.map((x) => x[1]));
          const today = new Date().toLocaleDateString("id-ID", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
          });
          return `<div class="row" style="align-items:flex-end;margin-bottom:18px"><div><h2>Dasbor bengkel</h2><p class="sub" style="margin:0">${today}</p></div><button class="btn" data-a="rep">Unduh laporan PDF</button></div>
<div class="kpis"><div class="kpi" style="--c:var(--mint2)"><b>${units}</b><span>Total unit alat</span></div><div class="kpi" style="--c:var(--pink2)"><b>${inUse}</b><span>Sedang keluar (${pct}% dari stok)</span></div><div class="kpi" style="--c:var(--mint)"><b>${wait.length}</b><span>Menunggu persetujuan</span></div><div class="kpi" style="--c:var(--hot)"><b>${late.length}</b><span>Peminjaman telat</span></div></div>
<div class="cols2"><div class="panel"><h3>Pengajuan 7 hari terakhir</h3><div class="chart">${days.map((x) => `<div>${x.n}<i style="height:${(x.n / mx) * 75}%"></i>${new Date(x.d).toLocaleDateString("id-ID", { weekday: "short" })}</div>`).join("")}</div></div>
<div class="panel"><h3>Status peminjaman</h3><div class="bars">${st.map(([s, n]) => `<div><i>${s}</i><b style="width:${(n / sm) * 100}%;min-width:6px"></b>${n}</div>`).join("")}</div></div></div>
<div class="panel" style="margin-top:14px"><h3>Peminjaman terbaru</h3><div style="overflow-x:auto"><table><tr><th>Peminjam</th><th>Alat</th><th>Jatuh tempo</th><th>Status</th></tr>${[
            ...L,
          ]
            .sort((a, b) => b.at - a.at)
            .slice(0, 6)
            .map(
              (l) =>
                `<tr><td>${esc(l.by)}</td><td>${esc(tool(l.tool).name)} x${l.qty}</td><td>${fmt(l.due)}</td><td>${chip(l)}</td></tr>`,
            )
            .join("")}</table></div></div>`;
        },
        telat: () => {
          const l = D.loans.filter((l) => l.status == "telat");
          return `<h2>Pantau telat</h2><p class="sub">Daftar peminjaman yang melewati jatuh tempo, ditandai otomatis oleh sistem.</p>${l.map((x) => loanCard(x)).join("") || `<div class="empty">Tidak ada keterlambatan. Semua peminjam tepat waktu.</div>`}`;
        },
      };
      const af = { q: "", st: "semua", sort: "nama", open: new Set() };
      const PRED = {
        semua: () => 1,
        tersedia: (t) => avail(t) > 0,
        dipinjam: (t) => used(t) > 0,
        habis: (t) => avail(t) <= 0,
        rusak: (t) => t.broken > 0,
      };
      function tl() {
        const T = D.tools,
          sum = (f) => T.reduce((a, t) => a + f(t), 0),
          tot = sum((t) => t.total),
          us = sum(used),
          br = sum((t) => t.broken),
          av = tot - us - br;
        const k = (id, n, l, c) =>
          `<button class="kpi ${af.st == id ? "on" : ""}" style="--c:var(${c})" data-a="flt" data-id="${id}"><b>${n}</b><span>${l}</span></button>`;
        $("#tsum").innerHTML =
          k("semua", tot, `Total unit (${T.length} jenis alat)`, "--mint") +
          k("tersedia", av, "Unit tersedia", "--mint2") +
          k("dipinjam", us, "Unit sedang dipinjam", "--pink2") +
          k("rusak", br, "Unit rusak", "--hot");
        $("#tchips").innerHTML = [
          ["semua", "Semua"],
          ["tersedia", "Tersedia"],
          ["dipinjam", "Sedang dipinjam"],
          ["habis", "Stok habis"],
          ["rusak", "Ada yang rusak"],
        ]
          .map(
            ([id, n]) =>
              `<button data-a="flt" data-id="${id}" class="${af.st == id ? "on" : ""}">${n} (${T.filter(PRED[id]).length})</button>`,
          )
          .join("");
        const L = T.filter(
          (t) =>
            PRED[af.st](t) &&
            (t.name + t.cat).toLowerCase().includes(af.q.toLowerCase()),
        ).sort(
          af.sort == "sisa"
            ? (a, b) => avail(a) - avail(b)
            : (a, b) => a.name.localeCompare(b.name),
        );
        $("#tlist").innerHTML =
          L.map((t) => {
            const a = avail(t),
              u = used(t),
              o = af.open.has(t.id),
              ls = D.loans.filter(
                (l) =>
                  l.tool == t.id &&
                  ["disetujui", "dipinjam", "telat"].includes(l.status),
              );
            return `<div class="card"><div class="row"><button class="nm" data-a="exp" data-id="${t.id}"><span class="car ${o ? "o" : ""}">&#9656;</span><b>${esc(t.name)}</b><span class="chip">${esc(t.cat)}</span></button><div>${a > 0 ? `<span class="chip disetujui">Tersedia</span> ` : `<span class="chip telat">Habis</span> `}${u ? `<span class="chip menunggu">Dipinjam</span> ` : ""}${t.broken ? `<span class="chip ditolak">Rusak</span>` : ""}</div></div>
<div class="seg"><i style="flex:${a};background:var(--mint2)"></i><i style="flex:${u};background:var(--pink2)"></i><i style="flex:${t.broken};background:var(--ink2)"></i></div><small style="color:var(--ink2)">Tersedia ${a}, dipinjam ${u}, rusak ${t.broken}, total ${t.total}</small>
${o ? `<div class="det"><p style="margin:0 0 8px">Kondisi terakhir: <b>${esc(t.cond)}</b></p>${ls.map((l) => `<div class="row" style="margin-bottom:6px"><span>${esc(l.by)} x${l.qty}, kembali ${fmt(l.due)}</span>${chip(l)}</div>`).join("") || "<p style='margin:0 0 8px;color:var(--ink2)'>Tidak sedang dipinjam.</p>"}<button class="btn g sm" data-a="edt" data-id="${t.id}">Ubah</button> <button class="btn ghost sm" data-a="delt" data-id="${t.id}">Hapus</button></div>` : ""}</div>`;
          }).join("") ||
          `<div class="empty">Tidak ada alat dengan filter ini. Coba pilih Semua.</div>`;
      }
      async function pdf() {
        const dl = window.claude ? await claude.use("downloads") : null;
        if (!dl || !window.jspdf)
          return toast("Unduhan PDF tidak tersedia di tampilan ini");
        const { jsPDF } = window.jspdf,
          doc = new jsPDF({ unit: "pt", format: "a4" }),
          L = [...D.loans].sort((a, b) => b.at - a.at),
          C = [
            [36, "Tgl pinjam", 54],
            [90, "Peminjam", 95],
            [190, "Alat", 135],
            [330, "Jml", 30],
            [362, "Jatuh tempo", 65],
            [432, "Status", 62],
            [498, "Kondisi", 60],
          ];
        doc.setFillColor(207, 233, 214);
        doc.rect(0, 0, 595, 92, "F");
        try {
          doc.addImage(LOGO, "PNG", 36, 14, 52, 64);
        } catch (e) {}
        doc.setTextColor(38, 68, 47);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("Laporan Peminjaman Alat Bengkel", 100, 42);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.text("SiPinjam SMK AKP Galang", 100, 60);
        doc.text("Dicetak " + new Date().toLocaleString("id-ID"), 100, 76);
        const c = (s) => L.filter((l) => l.status == s).length;
        doc.text(
          `Total ${L.length} peminjaman | sedang dipinjam ${c("dipinjam")} | telat ${c("telat")} | menunggu ${c("menunggu")} | dikembalikan ${c("dikembalikan")}`,
          36,
          116,
        );
        let y = 134;
        const head = () => {
          doc.setFillColor(249, 219, 227);
          doc.rect(30, y - 13, 535, 20, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(9);
          C.forEach(([x, n]) => doc.text(n, x, y));
          y += 20;
          doc.setFont("helvetica", "normal");
        };
        head();
        L.forEach((l, i) => {
          if (y > 800) {
            doc.addPage();
            y = 50;
            head();
          }
          if (i % 2 == 0) {
            doc.setFillColor(240, 248, 241);
            doc.rect(30, y - 13, 535, 20, "F");
          }
          const row = [
            fmt(l.at),
            l.by,
            tool(l.tool).name,
            String(l.qty),
            fmt(l.due),
            l.status,
            l.kond || "-",
          ];
          row.forEach((v, k) => {
            doc.setTextColor(
              ...(k == 5 && l.status == "telat"
                ? [217, 99, 138]
                : [38, 68, 47]),
            );
            doc.text(doc.splitTextToSize(v, C[k][2])[0], C[k][0], y);
          });
          y += 20;
        });
        const n = doc.getNumberOfPages();
        for (let i = 1; i <= n; i++) {
          doc.setPage(i);
          doc.setFontSize(8);
          doc.setTextColor(95, 118, 100);
          doc.text(`Halaman ${i} dari ${n}`, 500, 825);
        }
        try {
          await dl.save({
            filename: "laporan-sipinjam-smk-akp-galang.pdf",
            data: doc.output("arraybuffer"),
          });
          toast("Laporan PDF disimpan");
        } catch (e) {
          if (e && e.code != "declined") toast("PDF gagal disimpan");
        }
      }
      const dlg = $("#dlg");
      function open(title, body, k, id, ok = "Simpan") {
        dlg.innerHTML = `<form data-k="${k}" data-id="${id || ""}"><h3>${title}</h3>${body}<div class="row"><button type="button" class="btn ghost" data-a="close">Batal</button><button class="btn">${ok}</button></div></form>`;
        dlg.showModal();
      }
      const csvText = () =>
        [
          "Tanggal pinjam,Peminjam,Alat,Jumlah,Jatuh tempo,Status,Kondisi kembali",
        ]
          .concat(
            D.loans.map((l) =>
              [
                fmt(l.at),
                l.by,
                tool(l.tool).name,
                l.qty,
                fmt(l.due),
                l.status,
                l.kond || "",
              ]
                .map((c) => `"${String(c).replace(/"/g, '""')}"`)
                .join(","),
            ),
          )
          .join("\n");
      const toolForm = (t) =>
        `<label>Nama alat</label><input name="name" required value="${esc(t?.name)}"><label>Kategori</label><input name="cat" required value="${esc(t?.cat)}"><label>Jumlah total</label><input name="total" type="number" min="1" required value="${t?.total || 1}">`;
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const a = b.dataset.a,
          id = b.dataset.id,
          l = D.loans.find((x) => x.id == id);
        if (a == "tab") {
          tab = id;
          anim = true;
          render();
        } else if (a == "out") {
          SES = null;
          try {
            sessionStorage.removeItem(SK);
          } catch (e) {}
          render();
        } else if (a == "close") dlg.close();
        else if (a == "pinjam") {
          const t = tool(id),
            d = new Date(Date.now() + 3 * DAY).toISOString().slice(0, 10);
          open(
            `Pinjam ${esc(t.name)}`,
            `<label>Jumlah (maks ${avail(t)})</label><input name="qty" type="number" min="1" max="${avail(t)}" value="1" required><label>Tanggal kembali</label><input name="due" type="date" value="${d}" required><label>Keperluan</label><input name="why" required placeholder="Contoh: praktik las">`,
            "pinjam",
            id,
            "Ajukan",
          );
        } else if (a == "ok") {
          if (avail(tool(l.tool)) < l.qty)
            return toast("Stok tidak cukup untuk disetujui");
          l.status = "disetujui";
          note(
            l.by,
            `Pengajuan ${tool(l.tool).name} disetujui. Ambil di bengkel ya.`,
          );
          save();
          toast("Pengajuan disetujui");
          render();
        } else if (a == "no")
          open(
            "Tolak pengajuan",
            `<label>Alasan penolakan</label><input name="reason" required>`,
            "no",
            id,
            "Tolak",
          );
        else if (a == "pick") {
          l.status = "dipinjam";
          l.picked = Date.now();
          save();
          toast("Pengambilan dikonfirmasi");
          render();
        } else if (a == "ret")
          open(
            "Konfirmasi kembali",
            `<p>${esc(tool(l.tool).name)} dari ${esc(l.by)}</p><label>Kondisi alat</label><select name="kond"><option>Baik</option><option>Lecet halus</option><option>Rusak ringan</option><option>Rusak berat</option></select><label>Catatan</label><input name="cat" placeholder="Opsional">`,
            "ret",
            id,
            "Catat kembali",
          );
        else if (a == "flt") {
          af.st = id;
          tl();
        } else if (a == "exp") {
          af.open.has(id) ? af.open.delete(id) : af.open.add(id);
          tl();
        } else if (a == "addt") open("Tambah alat", toolForm(), "tool", "");
        else if (a == "edt") open("Ubah alat", toolForm(tool(id)), "tool", id);
        else if (a == "delt") {
          if (confirm("Hapus alat ini dari katalog?")) {
            D.tools = D.tools.filter((t) => t.id != id);
            save();
            render();
          }
        } else if (a == "rep") pdf();
      });
      document.addEventListener("input", (e) => {
        if (e.target.id == "q") grid();
        if (e.target.id == "tq") {
          af.q = e.target.value;
          tl();
        }
        if (e.target.id == "tsort") {
          af.sort = e.target.value;
          tl();
        }
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target,
          k = f.dataset.k,
          id = f.dataset.id,
          v = Object.fromEntries(new FormData(f));
        if (k == "login") {
          SES = { name: v.name.trim(), role: v.role };
          try {
            sessionStorage.setItem(SK, JSON.stringify(SES));
          } catch (x) {}
          tab = null;
          anim = true;
          return render();
        }
        if (k == "copy") {
          const c = $("#csv");
          c.select();
          try {
            navigator.clipboard.writeText(c.value);
          } catch (x) {
            document.execCommand("copy");
          }
          return toast("CSV disalin ke papan klip");
        }
        dlg.close();
        const l = D.loans.find((x) => x.id == id);
        if (k == "pinjam") {
          const t = tool(id),
            due = new Date(v.due + "T23:59:59").getTime();
          if (+v.qty > avail(t) || due < Date.now())
            return toast("Jumlah atau tanggal tidak valid");
          D.loans.push({
            id: "l" + Date.now(),
            by: SES.name,
            tool: id,
            qty: +v.qty,
            status: "menunggu",
            due,
            at: Date.now(),
            why: v.why,
          });
          toast("Pengajuan terkirim ke PLP");
        }
        if (k == "no") {
          l.status = "ditolak";
          l.reason = v.reason;
          note(l.by, `Pengajuan ${tool(l.tool).name} ditolak: ${v.reason}`);
          toast("Pengajuan ditolak");
        }
        if (k == "ret") {
          const t = tool(l.tool);
          l.status = "dikembalikan";
          l.kond = v.kond;
          l.ret = Date.now();
          t.cond = v.kond;
          if (v.kond == "Rusak berat") t.broken += l.qty;
          note(
            l.by,
            `${t.name} sudah dikembalikan dengan kondisi ${v.kond.toLowerCase()}. Terima kasih!`,
          );
          toast("Pengembalian dicatat");
        }
        if (k == "tool") {
          if (id) {
            Object.assign(tool(id), {
              name: v.name,
              cat: v.cat,
              total: +v.total,
            });
          } else
            D.tools.push({
              id: "t" + Date.now(),
              name: v.name,
              cat: v.cat,
              total: +v.total,
              broken: 0,
              cond: "Baik",
            });
          toast("Data alat disimpan");
        }
        if (k == "copy") {
          const c = $("#csv");
          c.select();
          try {
            navigator.clipboard.writeText(c.value);
          } catch (x) {
            document.execCommand("copy");
          }
          toast("CSV disalin ke papan klip");
          return;
        }
        save();
        render();
      });
      dlg.addEventListener(
        "submit",
        (e) => {
          if (e.target.dataset.k == "copy") {
            e.preventDefault();
          }
        },
        true,
      );
      function tick() {
        if (!SES) return;
        const fresh = rd(KEY);
        if (fresh) D = fresh;
        system();
        const s = JSON.stringify(D);
        const ts = $("#ts");
        if (ts) ts.textContent = new Date().toLocaleTimeString("id-ID");
        if (
          s !== last &&
          !dlg.open &&
          document.activeElement?.tagName != "INPUT"
        ) {
          last = s;
          render();
        }
      }
      window.addEventListener("storage", tick);
      setInterval(tick, 3000);
      system();
      save();
      last = JSON.stringify(D);
      render();
    </script>
  </body>
</html>
